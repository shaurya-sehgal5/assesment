services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: energy-forecast-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: energy-forecast-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
